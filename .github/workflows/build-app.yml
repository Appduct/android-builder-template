name: Build Android App
run-name: Build ${{ inputs.project_name }} (${{ inputs.build_id }})

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID from Appduct'
        required: true
      project_name:
        description: 'App display name'
        required: true
      website_url:
        description: 'Website URL to wrap'
        required: true
      package_name:
        description: 'Android package name (e.g. com.appduct.myapp)'
        required: true
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
      callback_url:
        description: 'Webhook callback URL'
        required: true
      app_icon_url:
        description: 'URL to app icon (optional)'
        required: false
      splash_screen_url:
        description: 'URL to splash screen image (optional)'
        required: false
      splash_bg_color:
        description: 'Splash screen background color'
        required: false
        default: '#6366F1'
      allow_screenshot:
        description: 'Allow screenshots'
        required: false
        default: 'true'
      allow_rotation:
        description: 'Allow screen rotation'
        required: false
        default: 'false'
      dark_mode:
        description: 'Force dark mode'
        required: false
        default: 'false'
      header_color:
        description: 'Status bar header color'
        required: false
        default: '#6366F1'
      screen_orientation:
        description: 'Screen orientation value'
        required: false
        default: 'portrait'
      admob_enabled:
        description: 'Enable AdMob'
        required: false
        default: 'false'
      admob_app_id:
        description: 'AdMob Application ID'
        required: false
      admob_banner_id:
        description: 'AdMob Banner Ad Unit ID'
        required: false
        default: 'none'
      admob_interstitial_id:
        description: 'AdMob Interstitial Ad Unit ID'
        required: false
        default: 'none'
      pull_to_refresh:
        description: 'Enable pull-to-refresh'
        required: false
        default: 'true'
      bottom_navigation:
        description: 'Show bottom navigation bar'
        required: false
        default: 'false'
      offline_mode:
        description: 'Enable offline cache mode'
        required: false
        default: 'false'
      extra_features_json:
        description: 'JSON blob: {device_navigation, landing_enabled, landing_layout, nav_tabs_enabled, multi_links, nav_tabs, expiry_timestamp}'
        required: false
        default: '{}'
      sync_config_json:
        description: 'JSON blob: {project_id, supabase_url, supabase_anon_key}'
        required: false
        default: '{}'
      signing_config_json:
        description: 'JSON blob: {keystore_b64, key_alias, store_password, key_password} - per-project signing key. Falls back to repo secrets if empty.'
        required: false
        default: '{}'




jobs:
  build:
    runs-on: ubuntu-latest
    # Keep time available for the terminal failure callback after Gradle stops.
    timeout-minutes: 35

    concurrency:
      group: appduct-android-${{ inputs.build_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle caches & wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/cache
          key: android-sdk-${{ runner.os }}-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Notify build started
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}
        run: |
          bash scripts/post_callback.sh \
            "$CALLBACK_URL" \
            "$BUILD_ID" \
            "processing" \
            "" \
            "GitHub Actions build started on runner ${{ runner.os }}" \
            "$BUILD_WEBHOOK_SECRET" || true

      - name: Generate Android project
        env:
          EXTRA_FEATURES_JSON: ${{ inputs.extra_features_json }}
          SYNC_CONFIG_JSON: ${{ inputs.sync_config_json }}
        run: |
          mkdir -p build-output
          sudo apt-get install -y jq > /dev/null 2>&1 || true

          # Parse consolidated JSON blobs (GitHub workflow_dispatch has a 25-input limit)
          EF="${EXTRA_FEATURES_JSON:-{}}"
          SC="${SYNC_CONFIG_JSON:-{}}"
          jq_get() { echo "$1" | jq -r "$2 // \"\"" 2>/dev/null || echo ""; }

          # Set variables
          APP_NAME="${{ inputs.project_name }}"
          PACKAGE_NAME="${{ inputs.package_name }}"
          WEBSITE_URL="${{ inputs.website_url }}"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          ALLOW_SCREENSHOT="${{ inputs.allow_screenshot }}"
          ALLOW_ROTATION="${{ inputs.allow_rotation }}"
          DARK_MODE="${{ inputs.dark_mode }}"
          HEADER_COLOR="${{ inputs.header_color }}"
          SCREEN_ORIENTATION="${{ inputs.screen_orientation }}"
          ADMOB_ENABLED="${{ inputs.admob_enabled }}"
          ADMOB_APP_ID="${{ inputs.admob_app_id }}"
          ADMOB_BANNER_ID="${{ inputs.admob_banner_id }}"
          ADMOB_INTERSTITIAL_ID="${{ inputs.admob_interstitial_id }}"
          PULL_TO_REFRESH="${{ inputs.pull_to_refresh }}"
          BOTTOM_NAV="${{ inputs.bottom_navigation }}"
          OFFLINE_MODE="${{ inputs.offline_mode }}"
          DEVICE_NAVIGATION="$(jq_get "$EF" '.device_navigation')"; [ -z "$DEVICE_NAVIGATION" ] && DEVICE_NAVIGATION="true"
          LANDING_ENABLED="$(jq_get "$EF" '.landing_enabled')"; [ -z "$LANDING_ENABLED" ] && LANDING_ENABLED="false"
          LANDING_LAYOUT="$(jq_get "$EF" '.landing_layout')"; [ -z "$LANDING_LAYOUT" ] && LANDING_LAYOUT="grid2"
          NAV_TABS_ENABLED="$(jq_get "$EF" '.nav_tabs_enabled')"; [ -z "$NAV_TABS_ENABLED" ] && NAV_TABS_ENABLED="false"
          EXPIRY_TIMESTAMP="$(jq_get "$EF" '.expiry_timestamp')"; [ -z "$EXPIRY_TIMESTAMP" ] && EXPIRY_TIMESTAMP="0"
          PROJECT_ID="$(jq_get "$SC" '.project_id')"
          SUPABASE_URL_VAL="$(jq_get "$SC" '.supabase_url')"
          SUPABASE_ANON_KEY_VAL="$(jq_get "$SC" '.supabase_anon_key')"
          VERSION_CODE_VAL="$(jq_get "$EF" '.version_code')"; [ -z "$VERSION_CODE_VAL" ] && VERSION_CODE_VAL="1"
          VERSION_NAME_VAL="$(jq_get "$EF" '.version_name')"; [ -z "$VERSION_NAME_VAL" ] && VERSION_NAME_VAL="1.0.0"
          KEEP_ALIVE_ENABLED="$(jq_get "$EF" '.keep_alive_enabled')"; [ -z "$KEEP_ALIVE_ENABLED" ] && KEEP_ALIVE_ENABLED="false"
          EXTERNAL_LINKS_IN_APP="$(jq_get "$EF" '.external_links_in_app')"; [ -z "$EXTERNAL_LINKS_IN_APP" ] && EXTERNAL_LINKS_IN_APP="true"
          BIOMETRIC_ENABLED="$(jq_get "$EF" '.biometric_login')"; [ -z "$BIOMETRIC_ENABLED" ] && BIOMETRIC_ENABLED="false"
          ADMOB_APP_OPEN_ENABLED="$(jq_get "$EF" '.admob_app_open_enabled')"; [ -z "$ADMOB_APP_OPEN_ENABLED" ] && ADMOB_APP_OPEN_ENABLED="false"
          ADMOB_APP_OPEN_ID="$(jq_get "$EF" '.admob_app_open_id')"; [ -z "$ADMOB_APP_OPEN_ID" ] && ADMOB_APP_OPEN_ID="none"
          ADMOB_INTERSTITIAL_INTERVAL="$(jq_get "$EF" '.admob_interstitial_interval')"; [ -z "$ADMOB_INTERSTITIAL_INTERVAL" ] && ADMOB_INTERSTITIAL_INTERVAL="3"

          # Conditional FOREGROUND_SERVICE wiring. Off by default to keep apps Play-policy compliant
          # (FOREGROUND_SERVICE_DATA_SYNC requires user-visible sync work). Apps that opt in
          # accept that they must justify the foreground service to Google Play.
          if [ "$KEEP_ALIVE_ENABLED" = "true" ]; then
            KEEP_ALIVE_PERMISSIONS='<uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />'
            KEEP_ALIVE_SERVICE='<service android:name=".KeepAliveService" android:enabled="true" android:exported="false" android:foregroundServiceType="dataSync" />'
            KEEP_ALIVE_START='try { val svc = Intent(this, KeepAliveService::class.java); if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) { startForegroundService(svc) } else { startService(svc) } } catch (_: Exception) {}'
            KEEP_ALIVE_STOP='try { stopService(Intent(this, KeepAliveService::class.java)) } catch (_: Exception) {}'
          else
            KEEP_ALIVE_PERMISSIONS=''
            KEEP_ALIVE_SERVICE=''
            KEEP_ALIVE_START=''
            KEEP_ALIVE_STOP=''
          fi


          
          # Copy template
          cp -r template/* build-output/
          
          # Replace placeholders in all files
          find build-output -type f \( -name "*.gradle" -o -name "*.xml" -o -name "*.kt" -o -name "*.properties" \) | while read file; do
            sed -i "s|%%APP_NAME%%|${APP_NAME}|g" "$file"
            sed -i "s|%%PACKAGE_NAME%%|${PACKAGE_NAME}|g" "$file"
            sed -i "s|%%WEBSITE_URL%%|${WEBSITE_URL}|g" "$file"
            sed -i "s|%%SPLASH_BG_COLOR%%|${{ inputs.splash_bg_color }}|g" "$file"
            sed -i "s|%%ALLOW_SCREENSHOT%%|${ALLOW_SCREENSHOT}|g" "$file"
            sed -i "s|%%DARK_MODE%%|${DARK_MODE}|g" "$file"
            sed -i "s|%%HEADER_COLOR%%|${HEADER_COLOR}|g" "$file"
            sed -i "s|%%SCREEN_ORIENTATION%%|${SCREEN_ORIENTATION}|g" "$file"
            sed -i "s|%%ADMOB_ENABLED%%|${ADMOB_ENABLED}|g" "$file"
            sed -i "s|%%ADMOB_APP_ID%%|${ADMOB_APP_ID}|g" "$file"
            sed -i "s|%%ADMOB_BANNER_ID%%|${ADMOB_BANNER_ID}|g" "$file"
            sed -i "s|%%ADMOB_INTERSTITIAL_ID%%|${ADMOB_INTERSTITIAL_ID}|g" "$file"
            sed -i "s|%%PULL_TO_REFRESH%%|${PULL_TO_REFRESH}|g" "$file"
            sed -i "s|%%BOTTOM_NAV%%|${BOTTOM_NAV}|g" "$file"
            sed -i "s|%%OFFLINE_MODE%%|${OFFLINE_MODE}|g" "$file"
            sed -i "s|%%DEVICE_NAVIGATION%%|${DEVICE_NAVIGATION}|g" "$file"
            sed -i "s|%%LANDING_ENABLED%%|${LANDING_ENABLED}|g" "$file"
            sed -i "s|%%LANDING_LAYOUT%%|${LANDING_LAYOUT}|g" "$file"
            sed -i "s|%%NAV_TABS_ENABLED%%|${NAV_TABS_ENABLED}|g" "$file"
            sed -i "s|%%EXPIRY_TIMESTAMP%%|${EXPIRY_TIMESTAMP}|g" "$file"
            sed -i "s|%%PROJECT_ID%%|${PROJECT_ID}|g" "$file"
            sed -i "s|%%SUPABASE_URL%%|${SUPABASE_URL_VAL}|g" "$file"
            sed -i "s|%%SUPABASE_ANON_KEY%%|${SUPABASE_ANON_KEY_VAL}|g" "$file"
            sed -i "s|%%VERSION_CODE%%|${VERSION_CODE_VAL}|g" "$file"
            sed -i "s|%%VERSION_NAME%%|${VERSION_NAME_VAL}|g" "$file"
            sed -i "s|%%EXTERNAL_LINKS_IN_APP%%|${EXTERNAL_LINKS_IN_APP}|g" "$file"
            sed -i "s|%%BIOMETRIC_ENABLED%%|${BIOMETRIC_ENABLED}|g" "$file"
            sed -i "s|%%ADMOB_APP_OPEN_ENABLED%%|${ADMOB_APP_OPEN_ENABLED}|g" "$file"
            sed -i "s|%%ADMOB_APP_OPEN_ID%%|${ADMOB_APP_OPEN_ID}|g" "$file"
            sed -i "s|%%ADMOB_INTERSTITIAL_INTERVAL%%|${ADMOB_INTERSTITIAL_INTERVAL}|g" "$file"
            # Use python for safer replacement of the keep-alive blocks (avoid sed delimiter issues with quotes/angles)
            KEEP_ALIVE_PERMISSIONS="$KEEP_ALIVE_PERMISSIONS" KEEP_ALIVE_SERVICE="$KEEP_ALIVE_SERVICE" KEEP_ALIVE_START="$KEEP_ALIVE_START" KEEP_ALIVE_STOP="$KEEP_ALIVE_STOP" python3 -c "import sys,os; p=sys.argv[1]; s=open(p,encoding='utf-8',errors='ignore').read(); s=s.replace('%%KEEP_ALIVE_PERMISSIONS%%', os.environ.get('KEEP_ALIVE_PERMISSIONS','')); s=s.replace('%%KEEP_ALIVE_SERVICE%%', os.environ.get('KEEP_ALIVE_SERVICE','')); s=s.replace('%%KEEP_ALIVE_START%%', os.environ.get('KEEP_ALIVE_START','')); s=s.replace('%%KEEP_ALIVE_STOP%%', os.environ.get('KEEP_ALIVE_STOP','')); open(p,'w',encoding='utf-8').write(s)" "$file"
          done
          
          # Move source files to correct package directory
          mkdir -p "build-output/app/src/main/java/${PACKAGE_PATH}"
          mv build-output/app/src/main/java/MainActivity.kt "build-output/app/src/main/java/${PACKAGE_PATH}/MainActivity.kt"
          if [ -f build-output/app/src/main/java/KeepAliveService.kt ]; then
            mv build-output/app/src/main/java/KeepAliveService.kt "build-output/app/src/main/java/${PACKAGE_PATH}/KeepAliveService.kt"
          fi

      - name: Ensure Gradle wrapper
        working-directory: build-output
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.5 --no-daemon
          fi

      - name: Download app icon
        if: inputs.app_icon_url != ''
        run: |
          ICON_URL="${{ inputs.app_icon_url }}"
          ICON_BG="${{ inputs.header_color }}"
          mkdir -p build-output/app/src/main/res/mipmap-xxxhdpi
          mkdir -p build-output/app/src/main/res/mipmap-xxhdpi
          mkdir -p build-output/app/src/main/res/mipmap-xhdpi
          mkdir -p build-output/app/src/main/res/mipmap-hdpi
          mkdir -p build-output/app/src/main/res/mipmap-mdpi
          
          # Download and resize icon for each density
          curl -fsSL --max-time 30 "$ICON_URL" -o /tmp/icon_original.img || true
          
          # Install imagemagick
          sudo apt-get install -y imagemagick > /dev/null 2>&1

          if ! convert /tmp/icon_original.img -resize 192x192 build-output/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/tmp/icon_convert_error.log; then
            echo "Icon download was not a valid image; generating a default icon instead."
            convert -size 1024x1024 xc:"$ICON_BG" /tmp/icon_original.img
            convert /tmp/icon_original.img -resize 192x192 build-output/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
          convert /tmp/icon_original.img -resize 144x144 build-output/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon_original.img -resize 96x96 build-output/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon_original.img -resize 72x72 build-output/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon_original.img -resize 48x48 build-output/app/src/main/res/mipmap-mdpi/ic_launcher.png
          
          # Copy as round icons too
          for dir in xxxhdpi xxhdpi xhdpi hdpi mdpi; do
            cp "build-output/app/src/main/res/mipmap-${dir}/ic_launcher.png" "build-output/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
          done

      - name: Download splash screen image
        run: |
          SPLASH_URL="${{ inputs.splash_screen_url }}"
          DRAWABLE_DIR="build-output/app/src/main/res/drawable"
          mkdir -p "$DRAWABLE_DIR"
          
          sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
          
          if [ -n "$SPLASH_URL" ] && [ "$SPLASH_URL" != "" ]; then
            echo "Downloading splash image from $SPLASH_URL"
            curl -sL "$SPLASH_URL" -o /tmp/splash_original.png
            if [ -f /tmp/splash_original.png ] && [ -s /tmp/splash_original.png ]; then
              convert /tmp/splash_original.png -resize 1080x1920 "${DRAWABLE_DIR}/splash_image.png"
              echo "Splash image downloaded and resized"
            else
              echo "Download failed, generating default splash image"
              convert -size 1080x1920 xc:"${{ inputs.splash_bg_color }}" "${DRAWABLE_DIR}/splash_image.png"
            fi
          else
            echo "No splash URL provided, generating default splash image"
            convert -size 1080x1920 xc:"${{ inputs.splash_bg_color }}" "${DRAWABLE_DIR}/splash_image.png"
          fi

      - name: Ensure round icons exist
        run: |
          for dir in $(find build-output/app/src/main/res -type d -name "mipmap-*"); do
            if [ -f "$dir/ic_launcher.png" ] && [ ! -f "$dir/ic_launcher_round.png" ]; then
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            fi
          done

      - name: Write multi-link & nav-tab JSON assets + download tile images
        env:
          EXTRA_FEATURES_JSON: ${{ inputs.extra_features_json }}
        run: |
          ASSETS_DIR="build-output/app/src/main/assets"
          DRAWABLE_DIR="build-output/app/src/main/res/drawable"
          mkdir -p "$ASSETS_DIR" "$DRAWABLE_DIR"
          sudo apt-get install -y jq imagemagick > /dev/null 2>&1 || true

          EF="${EXTRA_FEATURES_JSON:-{}}"
          MULTI_LINKS_JSON=$(echo "$EF" | jq -c '.multi_links // []' 2>/dev/null || echo '[]')
          NAV_TABS_JSON=$(echo "$EF" | jq -c '.nav_tabs // []' 2>/dev/null || echo '[]')
          LANDING_INTRO=$(echo "$EF" | jq -r '.landing_intro // ""' 2>/dev/null || echo '')

          # Persist the raw JSON arrays so the Kotlin side can render them at runtime
          printf '%s' "$MULTI_LINKS_JSON" > "$ASSETS_DIR/multi_links.json"
          printf '%s' "$NAV_TABS_JSON" > "$ASSETS_DIR/nav_tabs.json"
          printf '%s' "$LANDING_INTRO" > "$ASSETS_DIR/landing_intro.txt"

          # Download landing-page tile images (one drawable per item, indexed)
          if [ "$MULTI_LINKS_JSON" != "[]" ] && [ -n "$MULTI_LINKS_JSON" ]; then
            COUNT=$(echo "$MULTI_LINKS_JSON" | jq 'length' 2>/dev/null || echo 0)
            i=0
            while [ "$i" -lt "$COUNT" ]; do
              URL=$(echo "$MULTI_LINKS_JSON" | jq -r ".[$i].imageUrl // \"\"" 2>/dev/null || echo "")
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                if curl -sL --max-time 30 "$URL" -o "/tmp/tile_${i}.img" && [ -s "/tmp/tile_${i}.img" ]; then
                  convert "/tmp/tile_${i}.img" -resize 512x512^ -gravity center -extent 512x512 -quality 85 "${DRAWABLE_DIR}/tile_${i}.jpg" 2>/dev/null || true
                fi
              fi
              i=$((i + 1))
            done
          fi


      - name: Setup signing
        env:
          SIGNING_CONFIG_JSON: ${{ inputs.signing_config_json }}
          SYNC_CONFIG_JSON: ${{ inputs.sync_config_json }}
        run: |
          set -e
          sudo apt-get install -y jq > /dev/null 2>&1 || true
          SC="${SIGNING_CONFIG_JSON:-}"
          if [ -z "$SC" ] || [ "$SC" = "{}" ]; then
            SC=$(printf '%s' "${SYNC_CONFIG_JSON:-{}}" | jq -c '.signing_config // {}' 2>/dev/null || echo '{}')
          fi
          if [ -z "$SC" ] || [ "$SC" = "{}" ]; then
            echo "::error::Per-project signing config was not provided. Refusing to fall back to the shared keystore — every app must be signed with its own unique key. Open the project's Signing Key tab and click 'Generate keystore now', then retry the build."
            exit 1
          fi
          KEYSTORE_B64=$(echo "$SC" | jq -r '.keystore_b64 // ""')
          KEY_ALIAS_VAL=$(echo "$SC" | jq -r '.key_alias // ""')
          STORE_PASS=$(echo "$SC" | jq -r '.store_password // ""')
          KEY_PASS=$(echo "$SC" | jq -r '.key_password // ""')
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS_VAL" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Per-project signing config is incomplete (missing keystore_b64, key_alias, store_password, or key_password)."
            exit 1
          fi
          echo "Using per-project keystore (alias=$KEY_ALIAS_VAL)"

          printf '%s' "$KEYSTORE_B64" | base64 -d > build-output/release.keystore

          echo "=== Per-project signing certificate fingerprints ==="
          keytool -list -v \
            -keystore build-output/release.keystore \
            -alias "$KEY_ALIAS_VAL" \
            -storepass "$STORE_PASS" \
            2>/dev/null | grep -E "SHA1|SHA256|Owner|Valid" || echo "(fingerprint listing skipped)"
          echo "===================================================="

          cat >> build-output/local.properties << PROPS_EOF
          storeFile=../release.keystore
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS_VAL
          keyPassword=$KEY_PASS
          PROPS_EOF



      - name: Make gradlew executable
        run: chmod +x build-output/gradlew

      - name: Build APK & AAB
        working-directory: build-output
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=60s 25m \
            ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -eq 124 ]; then
            echo "Build stopped after the 25-minute safety limit." | tee -a build.log
          fi
          exit "$result"
          
      - name: Upload artifacts to Supabase Storage
        id: upload
        run: |
          set -euo pipefail
          BUILD_ID="${{ inputs.build_id }}"
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          upload_file() {
            local file_path="$1"
            local object_path="$2"
            local content_type="$3"
            local response_file
            response_file=$(mktemp)

            local http_status
            http_status=$(curl -sS -o "$response_file" -w "%{http_code}" -X POST "${SUPABASE_URL}/storage/v1/object/app-assets/${object_path}" \
              -H "Authorization: Bearer ${SERVICE_KEY}" \
              -H "x-upsert: true" \
              -H "Content-Type: ${content_type}" \
              --data-binary @"$file_path")

            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "Storage upload failed for ${object_path} (HTTP ${http_status})" >&2
              cat "$response_file" >&2
              rm -f "$response_file"
              return 1
            fi

            rm -f "$response_file"
            printf "%s" "${SUPABASE_URL}/storage/v1/object/public/app-assets/${object_path}"
          }
          
          # Find built files
          APK_FILE=$(find build-output/app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB_FILE=$(find build-output/app/build/outputs/bundle/release -name "*.aab" | head -1)

          # Sanitize app name for use as filename (alphanumeric, dash, underscore only)
          RAW_APP_NAME="${{ inputs.project_name }}"
          SAFE_APP_NAME=$(echo "$RAW_APP_NAME" | tr ' ' '-' | tr -cd '[:alnum:]_-' | cut -c1-60)
          if [ -z "$SAFE_APP_NAME" ]; then
            SAFE_APP_NAME="app"
          fi
          echo "Using filename base: $SAFE_APP_NAME"

          DOWNLOAD_URLS=""
          
          # Upload APK
          if [ -f "$APK_FILE" ]; then
            APK_PATH="builds/${BUILD_ID}/${SAFE_APP_NAME}.apk"
            APK_URL=$(upload_file "$APK_FILE" "$APK_PATH" "application/vnd.android.package-archive")
            DOWNLOAD_URLS="$APK_URL"
            echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT
          fi
          
          # Upload AAB
          if [ -f "$AAB_FILE" ]; then
            AAB_PATH="builds/${BUILD_ID}/${SAFE_APP_NAME}.aab"
            AAB_URL=$(upload_file "$AAB_FILE" "$AAB_PATH" "application/octet-stream")
            echo "aab_url=${AAB_URL}" >> $GITHUB_OUTPUT
            
            # Use AAB as primary download
            DOWNLOAD_URLS="${AAB_URL}"
          fi

          if [ -z "$DOWNLOAD_URLS" ]; then
            echo "No APK or AAB artifacts were found after the build." >&2
            exit 1
          fi
          
          echo "download_url=${DOWNLOAD_URLS}" >> $GITHUB_OUTPUT

      - name: Notify build completed
        if: success()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          DOWNLOAD_URL: ${{ steps.upload.outputs.download_url }}
          APK_URL: ${{ steps.upload.outputs.apk_url }}
          AAB_URL: ${{ steps.upload.outputs.aab_url }}
          BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}
        run: |
          APK_CALLBACK_URL="${APK_URL:-N/A}"
          AAB_CALLBACK_URL="${AAB_URL:-N/A}"
          bash scripts/post_callback.sh \
            "$CALLBACK_URL" \
            "$BUILD_ID" \
            "completed" \
            "$DOWNLOAD_URL" \
            "Build completed successfully. APK: ${APK_CALLBACK_URL}, AAB: ${AAB_CALLBACK_URL}" \
            "$BUILD_WEBHOOK_SECRET"

      - name: Notify build failed
        if: failure()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}
        run: |
          LOGS=$(tail -50 build-output/build.log 2>/dev/null || echo "No logs available")
          bash scripts/post_callback.sh \
            "$CALLBACK_URL" \
            "$BUILD_ID" \
            "failed" \
            "" \
            "Build failed. Last 50 lines: ${LOGS}" \
            "$BUILD_WEBHOOK_SECRET" || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ inputs.build_id }}
          path: |
            build-output/app/build/outputs/apk/release/*.apk
            build-output/app/build/outputs/bundle/release/*.aab
          retention-days: 30
